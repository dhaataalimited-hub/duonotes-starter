<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Lesson - Spin the Wheel</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1125;color:#edf2ff;font:17px system-ui,sans-serif;line-height:1.5}main{max-width:640px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,7vw,40px);line-height:1.15}small,.muted{color:#abbad9}section{background:#18223e;border:1px solid #344568;border-radius:20px;padding:20px;margin:20px 0}button,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:12px 18px;margin:5px 3px;background:#87efcd;color:#092920;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}.choices button{display:block;width:100%;margin:10px 0;text-align:left}textarea{width:100%;min-height:110px;background:#0b1125;color:white;border:1px solid #7387b4;border-radius:10px;padding:12px}#saveStatus{font-size:13px;color:#abbad9}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#080e20;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{aspect-ratio:1;font-size:30px;margin:0}.wheel{width:min(240px,75vw);aspect-ratio:1;border-radius:50%;margin:20px auto;background:conic-gradient(#87efcd 0deg 60deg,#fdd47d 60deg 120deg,#f6a4be 120deg 180deg,#acb9ff 180deg 240deg,#7ed5f2 240deg 300deg,#d1a7eb 300deg);display:grid;place-items:center;border:7px solid #edf2ff;color:#112038;font-weight:900;transition:transform 1s cubic-bezier(.2,.7,.2,1)}@media(prefers-reduced-motion:reduce){.wheel{transition:none}}</style></head><body><main><small>DUONOTES / PLAY & DISCOVER</small><h1>Fun Lesson - Spin the Wheel</h1><p>Spin for a small creative adventure. There is no wrong answer.</p><section><p style="text-align:center">▼ Your challenge awaits</p><div class="wheel" id="wheel" aria-hidden="true">CREATE</div><button id="spin">Spin the wheel</button><h2 id="challenge" aria-live="polite"></h2><label for="note">Your idea or response</label><textarea id="note" maxlength="4000"></textarea><button id="done">Challenge complete</button><p id="count"></p></section><p id="saveStatus" role="status">Progress stays on this device. No network needed.</p></main><script>
"use strict";
const $=id=>document.getElementById(id);const key='duonotes.fun.Spin the Wheel.v1';let loaded=null;const native=window.duonotes&&typeof window.duonotes.save==='function'&&typeof window.duonotes.load==='function';try{loaded=native?window.duonotes.load():JSON.parse(localStorage.getItem(key)||'null')}catch(e){$('saveStatus').textContent='Storage unavailable. You can still play.'}function save(state){try{const data={version:1,...state};if(native){window.duonotes.save(data);$('saveStatus').textContent='Save requested on this phone; confirmation and sync are unavailable.'}else{localStorage.setItem(key,JSON.stringify(data));$('saveStatus').textContent='Saved in this browser only.'}}catch(e){$('saveStatus').textContent='Could not save. You can still play.'}}

const challenges=['Invent a friendly robot. Give it a name and one surprising talent.','Write a four-line poem about a rainy day.','Design a new planet. Describe its sky, plants and creatures.','Tell a tiny story using the words moon, sandwich and bicycle.','Invent a game that needs only paper. Explain three rules.','Imagine an animal café. What is on the menu?'];let s={choice:-1,note:'',count:0};if(loaded&&loaded.version===1&&Number.isInteger(loaded.choice)&&loaded.choice>=-1&&loaded.choice<6&&typeof loaded.note==='string'&&Number.isInteger(loaded.count)&&loaded.count>=0)s={choice:loaded.choice,note:loaded.note.slice(0,4000),count:loaded.count};let busy=false,angle=0;function render(){$('challenge').textContent=s.choice<0?'Ready for inspiration?':challenges[s.choice];$('note').value=s.note;$('count').textContent=`Challenges completed: ${s.count}`;$('done').disabled=s.choice<0}function persist(){save(s)}$('spin').onclick=()=>{if(busy)return;busy=true;$('spin').disabled=true;s.choice=Math.floor(Math.random()*6);s.note='';angle+=1080+(360-angle%360)%360+(360-(s.choice*60+30));$('wheel').style.transform=`rotate(${angle}deg)`;setTimeout(()=>{busy=false;$('spin').disabled=false;persist();render()},1050)};$('note').oninput=()=>{s.note=$('note').value;persist()};$('done').onclick=()=>{if(s.choice<0||busy)return;s.count++;s.choice=-1;persist();render()};render();

</script></body></html>
