<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Lesson - Choose Your Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1125;color:#edf2ff;font:17px system-ui,sans-serif;line-height:1.5}main{max-width:640px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,7vw,40px);line-height:1.15}small,.muted{color:#abbad9}section{background:#18223e;border:1px solid #344568;border-radius:20px;padding:20px;margin:20px 0}button,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:12px 18px;margin:5px 3px;background:#87efcd;color:#092920;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}.choices button{display:block;width:100%;margin:10px 0;text-align:left}textarea{width:100%;min-height:110px;background:#0b1125;color:white;border:1px solid #7387b4;border-radius:10px;padding:12px}#saveStatus{font-size:13px;color:#abbad9}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#080e20;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{aspect-ratio:1;font-size:30px;margin:0}.wheel{width:min(240px,75vw);aspect-ratio:1;border-radius:50%;margin:20px auto;background:conic-gradient(#87efcd 0deg 60deg,#fdd47d 60deg 120deg,#f6a4be 120deg 180deg,#acb9ff 180deg 240deg,#7ed5f2 240deg 300deg,#d1a7eb 300deg);display:grid;place-items:center;border:7px solid #edf2ff;color:#112038;font-weight:900;transition:transform 1s cubic-bezier(.2,.7,.2,1)}@media(prefers-reduced-motion:reduce){.wheel{transition:none}}</style></head><body><main><small>DUONOTES / PLAY & DISCOVER</small><h1>Fun Lesson - Choose Your Adventure</h1><p>The Lantern Library · Your choices lead to three different endings.</p><section><p id="trail" class="muted"></p><h2 id="sceneTitle"></h2><p id="story"></p><div id="choices" class="choices"></div></section><button id="restart">Restart story</button><p id="saveStatus" role="status">Progress stays on this device. No network needed.</p></main><script>
"use strict";
const $=id=>document.getElementById(id);const key='duonotes.fun.Choose Your Adventure.v1';let loaded=null;const native=window.duonotes&&typeof window.duonotes.save==='function'&&typeof window.duonotes.load==='function';try{loaded=native?window.duonotes.load():JSON.parse(localStorage.getItem(key)||'null')}catch(e){$('saveStatus').textContent='Storage unavailable. You can still play.'}function save(state){try{const data={version:1,...state};if(native){window.duonotes.save(data);$('saveStatus').textContent='Save requested on this phone; confirmation and sync are unavailable.'}else{localStorage.setItem(key,JSON.stringify(data));$('saveStatus').textContent='Saved in this browser only.'}}catch(e){$('saveStatus').textContent='Could not save. You can still play.'}}

const scenes={start:['A light in the rain','A tiny library glows at the end of a flooded street. Inside, a fox librarian needs help finding a missing star.',[['Search the rooftop','roof'],['Explore the cellar','cellar']]],roof:['The wind map','On the roof, paper birds circle a telescope. One carries a map.',[['Follow the paper bird','garden'],['Look through the telescope','sky']]],cellar:['A quiet machine','A brass engine hums beside a sleeping turtle. A star-shaped key hangs above it.',[['Wake the turtle gently','garden'],['Turn the star key','engine']]],garden:['The moon garden','The turtle and the paper bird lead you to a seed that shines. It needs a home.',[['Plant it beside the library','grow'],['Carry it to the rooftop','sky']]],engine:['A difficult choice','The engine can launch the star, but the library will go dark for one night.',[['Ask the neighbours for lanterns','together'],['Find another way in the garden','garden']]],sky:['The sky remembers','You lift the little light toward the sky. Constellations gather around it, and a new star appears. The fox names it after your kindness.',[]],grow:['A library of light','You plant the seed. By dawn, a tree of tiny stars lights the street. Every visitor takes a story home beneath its branches.',[]],together:['A hundred lanterns','Neighbours bring lanterns. Together you launch the star and keep the library bright. The fox learns that asking for help can be an adventure too.',[]]};
let path=loaded&&loaded.version===1&&Array.isArray(loaded.path)&&loaded.path.length<20&&loaded.path[0]==='start'&&loaded.path.every((x,i,a)=>scenes[x]&&(i===0||scenes[a[i-1]][2].some(c=>c[1]===x)))?loaded.path:['start'];function render(){const s=scenes[path[path.length-1]];$('trail').textContent=`Chapter ${path.length} · ${s[2].length?'Make your choice':'The end'}`;$('sceneTitle').textContent=s[0];$('story').textContent=s[1];$('choices').replaceChildren();s[2].forEach(([label,to])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{path.push(to);save({path});render()};$('choices').append(b)})}$('restart').onclick=()=>{path=['start'];save({path});render()};render();

</script></body></html>
