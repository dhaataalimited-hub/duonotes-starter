<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Lesson - Brain Battle</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1125;color:#edf2ff;font:17px system-ui,sans-serif;line-height:1.5}main{max-width:640px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,7vw,40px);line-height:1.15}small,.muted{color:#abbad9}section{background:#18223e;border:1px solid #344568;border-radius:20px;padding:20px;margin:20px 0}button,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:12px 18px;margin:5px 3px;background:#87efcd;color:#092920;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}.choices button{display:block;width:100%;margin:10px 0;text-align:left}textarea{width:100%;min-height:110px;background:#0b1125;color:white;border:1px solid #7387b4;border-radius:10px;padding:12px}#saveStatus{font-size:13px;color:#abbad9}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#080e20;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{aspect-ratio:1;font-size:30px;margin:0}.wheel{width:min(240px,75vw);aspect-ratio:1;border-radius:50%;margin:20px auto;background:conic-gradient(#87efcd 0deg 60deg,#fdd47d 60deg 120deg,#f6a4be 120deg 180deg,#acb9ff 180deg 240deg,#7ed5f2 240deg 300deg,#d1a7eb 300deg);display:grid;place-items:center;border:7px solid #edf2ff;color:#112038;font-weight:900;transition:transform 1s cubic-bezier(.2,.7,.2,1)}@media(prefers-reduced-motion:reduce){.wheel{transition:none}}</style></head><body><main><small>DUONOTES / PLAY & DISCOVER</small><h1>Fun Lesson - Brain Battle</h1><p>Ten questions. One curious mind. Learn something with every answer.</p><section><p id="progress"></p><h2 id="question"></h2><div id="answers" class="choices"></div><p id="feedback" aria-live="polite"></p><button id="next">Next question</button></section><button id="restart">Start over</button><p id="saveStatus" role="status">Progress stays on this device. No network needed.</p></main><script>
"use strict";
const $=id=>document.getElementById(id);const key='duonotes.fun.Brain Battle.v1';let loaded=null;const native=window.duonotes&&typeof window.duonotes.save==='function'&&typeof window.duonotes.load==='function';try{loaded=native?window.duonotes.load():JSON.parse(localStorage.getItem(key)||'null')}catch(e){$('saveStatus').textContent='Storage unavailable. You can still play.'}function save(state){try{const data={version:1,...state};if(native){window.duonotes.save(data);$('saveStatus').textContent='Save requested on this phone; confirmation and sync are unavailable.'}else{localStorage.setItem(key,JSON.stringify(data));$('saveStatus').textContent='Saved in this browser only.'}}catch(e){$('saveStatus').textContent='Could not save. You can still play.'}}

const questions=[['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter'],1,'Iron-rich dust gives Mars its rusty colour.'],['How many sides does a hexagon have?',['5','6','8'],1,'Hex means six.'],['Which gas do plants take in during photosynthesis?',['Carbon dioxide','Helium','Hydrogen'],0,'Plants use light, water and carbon dioxide to make sugars.'],['What is 9 × 7?',['56','72','63'],2,'Nine groups of seven make 63.'],['Which ocean is the largest?',['Atlantic','Pacific','Indian'],1,'The Pacific covers more area than any other ocean.'],['Which instrument measures temperature?',['Barometer','Thermometer','Compass'],1,'A thermometer measures temperature.'],['What does HTML describe?',['Web page structure','Battery power','Internet speed'],0,'HTML gives web content its structure.'],['Which animal is a mammal?',['Shark','Dolphin','Octopus'],1,'Dolphins breathe air and nurse their young.'],['Water freezes at what temperature at standard pressure?',['0°C','10°C','100°C'],0,'Zero degrees Celsius is the standard freezing point.'],['Which fraction equals one half?',['2/3','3/4','2/4'],2,'Two out of four equal parts is one half.']];
let picks=loaded&&loaded.version===1&&Array.isArray(loaded.picks)&&loaded.picks.length<=10&&loaded.picks.every(x=>Number.isInteger(x)&&x>=0&&x<3)?loaded.picks:[];let index=picks.length;
function render(){const score=picks.reduce((n,x,i)=>n+(x===questions[i][2]),0);$('answers').replaceChildren();$('feedback').textContent='';$('next').hidden=true;if(index>=10){$('progress').textContent='Round complete';$('question').textContent=`You scored ${score} / 10!`;$('feedback').textContent='Start over to try again.';return}const q=questions[index];$('progress').textContent=`Question ${index+1} / 10 · Score ${score}`;$('question').textContent=q[0];q[1].forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.disabled=picks[index]!==undefined;b.onclick=()=>{if(picks[index]!==undefined)return;picks[index]=i;save({picks});render()};$('answers').append(b)});if(picks[index]!==undefined){$('feedback').textContent=(picks[index]===q[2]?'Correct! ':'Answer: '+q[1][q[2]]+'. ')+q[3];$('next').hidden=false;$('next').textContent=index===9?'See results':'Next question'}}$('next').onclick=()=>{index++;render()};$('restart').onclick=()=>{picks=[];index=0;save({picks});render()};render();

</script></body></html>
