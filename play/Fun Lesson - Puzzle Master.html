<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Lesson - Puzzle Master</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1125;color:#edf2ff;font:17px system-ui,sans-serif;line-height:1.5}main{max-width:640px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,7vw,40px);line-height:1.15}small,.muted{color:#abbad9}section{background:#18223e;border:1px solid #344568;border-radius:20px;padding:20px;margin:20px 0}button,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:12px 18px;margin:5px 3px;background:#87efcd;color:#092920;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}.choices button{display:block;width:100%;margin:10px 0;text-align:left}textarea{width:100%;min-height:110px;background:#0b1125;color:white;border:1px solid #7387b4;border-radius:10px;padding:12px}#saveStatus{font-size:13px;color:#abbad9}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#080e20;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{aspect-ratio:1;font-size:30px;margin:0}.wheel{width:min(240px,75vw);aspect-ratio:1;border-radius:50%;margin:20px auto;background:conic-gradient(#87efcd 0deg 60deg,#fdd47d 60deg 120deg,#f6a4be 120deg 180deg,#acb9ff 180deg 240deg,#7ed5f2 240deg 300deg,#d1a7eb 300deg);display:grid;place-items:center;border:7px solid #edf2ff;color:#112038;font-weight:900;transition:transform 1s cubic-bezier(.2,.7,.2,1)}@media(prefers-reduced-motion:reduce){.wheel{transition:none}}</style></head><body><main><small>DUONOTES / PLAY & DISCOVER</small><h1>Fun Lesson - Puzzle Master</h1><p>Slide neighbouring tiles into the empty space. Put 1–8 in order, with the gap last.</p><section><p id="moves" aria-live="polite"></p><div id="board" class="grid" aria-label="Sliding puzzle"></div><p id="message" aria-live="polite"></p></section><button id="shuffle">New puzzle</button><p class="muted">Tap a tile next to the gap. With a keyboard, Tab to a tile and press Enter.</p><p id="saveStatus" role="status">Progress stays on this device. No network needed.</p></main><script>
"use strict";
const $=id=>document.getElementById(id);const key='duonotes.fun.Puzzle Master.v1';let loaded=null;const native=window.duonotes&&typeof window.duonotes.save==='function'&&typeof window.duonotes.load==='function';try{loaded=native?window.duonotes.load():JSON.parse(localStorage.getItem(key)||'null')}catch(e){$('saveStatus').textContent='Storage unavailable. You can still play.'}function save(state){try{const data={version:1,...state};if(native){window.duonotes.save(data);$('saveStatus').textContent='Save requested on this phone; confirmation and sync are unavailable.'}else{localStorage.setItem(key,JSON.stringify(data));$('saveStatus').textContent='Saved in this browser only.'}}catch(e){$('saveStatus').textContent='Could not save. You can still play.'}}

function solved(b){return b.every((v,i)=>v===(i+1)%9)}function neighbors(i){return [i-3,i+3,i%3?i-1:-1,i%3<2?i+1:-1].filter(x=>x>=0&&x<9)}function valid(b){if(!Array.isArray(b)||b.length!==9||new Set(b).size!==9||!b.every(x=>Number.isInteger(x)&&x>=0&&x<9))return false;let inv=0;for(let i=0;i<9;i++)for(let j=i+1;j<9;j++)if(b[i]&&b[j]&&b[i]>b[j])inv++;return inv%2===0}let board=[1,2,3,4,5,6,7,8,0],moves=0;function shuffle(){board=[1,2,3,4,5,6,7,8,0];let previous=-1;for(let n=0;n<160;n++){const z=board.indexOf(0),opts=neighbors(z).filter(x=>x!==previous),i=opts[Math.floor(Math.random()*opts.length)];[board[z],board[i]]=[board[i],board[z]];previous=z}if(solved(board)){[board[7],board[8]]=[board[8],board[7]]}moves=0;save({board,moves});render()}function move(i){const z=board.indexOf(0);if(solved(board)||!neighbors(z).includes(i))return;[board[z],board[i]]=[board[i],board[z]];moves++;save({board,moves});render()}function render(){$('moves').textContent=`Moves: ${moves}`;$('message').textContent=solved(board)?'Solved! Brilliant work. Try a new puzzle.':'Keep sliding — every new puzzle is solvable.';$('board').replaceChildren();board.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v||'';b.setAttribute('aria-label',v?`Tile ${v}`:'Empty space');b.disabled=!v||solved(board)||!neighbors(board.indexOf(0)).includes(i);b.style.background=v?'#acb9ff':'#0b1125';b.onclick=()=>move(i);$('board').append(b)})}$('shuffle').onclick=shuffle;if(loaded&&loaded.version===1&&valid(loaded.board)&&Number.isInteger(loaded.moves)&&loaded.moves>=0){board=loaded.board;moves=loaded.moves;render()}else shuffle();

</script></body></html>
