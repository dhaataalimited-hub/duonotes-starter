<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Lesson - HTML Game</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1125;color:#edf2ff;font:17px system-ui,sans-serif;line-height:1.5}main{max-width:640px;margin:auto;padding:24px 16px 40px}h1{font-size:clamp(27px,7vw,40px);line-height:1.15}small,.muted{color:#abbad9}section{background:#18223e;border:1px solid #344568;border-radius:20px;padding:20px;margin:20px 0}button,textarea{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:12px 18px;margin:5px 3px;background:#87efcd;color:#092920;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}.choices button{display:block;width:100%;margin:10px 0;text-align:left}textarea{width:100%;min-height:110px;background:#0b1125;color:white;border:1px solid #7387b4;border-radius:10px;padding:12px}#saveStatus{font-size:13px;color:#abbad9}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#080e20;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{aspect-ratio:1;font-size:30px;margin:0}.wheel{width:min(240px,75vw);aspect-ratio:1;border-radius:50%;margin:20px auto;background:conic-gradient(#87efcd 0deg 60deg,#fdd47d 60deg 120deg,#f6a4be 120deg 180deg,#acb9ff 180deg 240deg,#7ed5f2 240deg 300deg,#d1a7eb 300deg);display:grid;place-items:center;border:7px solid #edf2ff;color:#112038;font-weight:900;transition:transform 1s cubic-bezier(.2,.7,.2,1)}@media(prefers-reduced-motion:reduce){.wheel{transition:none}}</style></head><body><main><small>DUONOTES / PLAY & DISCOVER</small><h1>Fun Lesson - HTML Game</h1><p>Space Defender · Move your ship, dodge invaders and clear 15 to win.</p><section><p id="score" aria-live="polite"></p><canvas id="game" width="360" height="420" aria-label="Space defender playfield"></canvas><div style="display:flex;justify-content:space-between"><button id="left" aria-label="Move left">◀</button><button id="fire">Fire</button><button id="right" aria-label="Move right">▶</button></div><button id="start">Start mission</button><button id="pause" disabled>Pause</button><p id="message" aria-live="polite">Drag on the playfield to steer. Use Fire or Space to shoot. Arrow keys also move.</p></section><p id="saveStatus" role="status">Progress stays on this device. No network needed.</p></main><script>
"use strict";
const $=id=>document.getElementById(id);const key='duonotes.fun.HTML Game.v1';let loaded=null;const native=window.duonotes&&typeof window.duonotes.save==='function'&&typeof window.duonotes.load==='function';try{loaded=native?window.duonotes.load():JSON.parse(localStorage.getItem(key)||'null')}catch(e){$('saveStatus').textContent='Storage unavailable. You can still play.'}function save(state){try{const data={version:1,...state};if(native){window.duonotes.save(data);$('saveStatus').textContent='Save requested on this phone; confirmation and sync are unavailable.'}else{localStorage.setItem(key,JSON.stringify(data));$('saveStatus').textContent='Saved in this browser only.'}}catch(e){$('saveStatus').textContent='Could not save. You can still play.'}}

const canvas=$('game'),ctx=canvas.getContext('2d');let best=loaded&&loaded.version===1&&Number.isInteger(loaded.best)&&loaded.best>=0?loaded.best:0;let x=180,bullets=[],enemies=[],points=0,lives=3,running=false,paused=false,spawn=0,cooldown=0,last=0,keys={};function summary(){$('score').textContent=`Score ${points} / 15 · Shields ${lives} · Best ${best}`}function record(){best=Math.max(best,points);save({best})}function end(win){running=false;keys={};record();$('message').textContent=win?'Mission complete! You defended the station.':'Mission over. Try again!';$('pause').disabled=true;summary()}function fire(){if(running&&!paused&&cooldown<=0){bullets.push({x,y:370});cooldown=.22}}function draw(){ctx.clearRect(0,0,360,420);ctx.fillStyle='#8b9dc3';for(let i=0;i<35;i++)ctx.fillRect((i*83)%360,(i*71)%420,2,2);ctx.fillStyle='#87efcd';ctx.beginPath();ctx.moveTo(x,365);ctx.lineTo(x-14,394);ctx.lineTo(x+14,394);ctx.fill();ctx.fillStyle='#fdd47d';bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,12));ctx.fillStyle='#f6a4be';enemies.forEach(e=>{ctx.fillRect(e.x-12,e.y-10,24,20);ctx.fillRect(e.x-18,e.y-2,36,4)})}function tick(t){const dt=Math.min((t-last)/1000||0,.04);last=t;if(running&&!paused){x=Math.max(16,Math.min(344,x+((keys.right?1:0)-(keys.left?1:0))*240*dt));cooldown-=dt;if(keys.fire)fire();spawn-=dt;if(spawn<=0){enemies.push({x:20+Math.random()*320,y:-12});spawn=.7}bullets.forEach(b=>b.y-=350*dt);enemies.forEach(e=>e.y+=(75+points*3)*dt);for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],hit=bullets.findIndex(b=>Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<18);if(hit>=0){bullets.splice(hit,1);enemies.splice(i,1);points++;if(points>=15){end(true);break}}else if(e.y>420||(Math.abs(e.x-x)<24&&Math.abs(e.y-380)<24)){enemies.splice(i,1);lives--;if(lives<=0){end(false);break}}}bullets=bullets.filter(b=>b.y>-20);summary()}draw();requestAnimationFrame(tick)}$('start').onclick=()=>{x=180;bullets=[];enemies=[];points=0;lives=3;spawn=0;cooldown=0;running=true;paused=false;keys={};$('pause').disabled=false;$('pause').textContent='Pause';$('message').textContent='Defend the station! Clear 15 invaders.';summary()};function pause(){if(!running)return;paused=!paused;keys={};$('pause').textContent=paused?'Resume':'Pause';$('message').textContent=paused?'Paused. Take a breather.':'Defend the station!'}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});function hold(id,k){const b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;if(k==='fire')fire()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{keys[k]=false};b.onclick=e=>{if(e.detail===0){if(k==='fire')fire();else x=Math.max(16,Math.min(344,x+(k==='left'?-25:25)))}}}hold('left','left');hold('right','right');hold('fire','fire');function steer(e){const r=canvas.getBoundingClientRect();x=Math.max(16,Math.min(344,(e.clientX-r.left)*360/r.width))}let dragging=false;canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId);steer(e)};canvas.onpointermove=e=>{if(dragging)steer(e)};canvas.onpointerup=canvas.onpointercancel=()=>dragging=false;document.addEventListener('keydown',e=>{const k={ArrowLeft:'left',ArrowRight:'right',' ':'fire'}[e.key];if(k&&running&&(k!=='fire'||e.target.tagName!=='BUTTON')){e.preventDefault();keys[k]=true}});document.addEventListener('keyup',e=>{const k={ArrowLeft:'left',ArrowRight:'right',' ':'fire'}[e.key];if(k)keys[k]=false});window.addEventListener('blur',()=>{keys={};if(running&&!paused)pause()});summary();requestAnimationFrame(tick);

</script></body></html>
